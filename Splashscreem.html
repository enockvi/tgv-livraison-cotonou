<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TGV Livraison</title>
<meta name="theme-color" content="#07401F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&family=Plus+Jakarta+Sans:wght@500&display=swap" rel="stylesheet">
<style>
:root{--g:#46C630}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#07401F;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
.stage{position:relative;width:100%;height:100dvh;overflow:hidden;cursor:pointer;
 background:radial-gradient(circle at 50% 52%,rgba(70,198,48,.16),transparent 55%),linear-gradient(165deg,#0C6B32 0%,#07401F 55%,#052C16 100%)}
.road{position:absolute;left:max(12px,4vw);right:max(12px,4vw);top:52%;height:1px;background:rgba(255,255,255,.16)}
.word{position:absolute;left:50%;bottom:calc(48% + 10px);transform:translateX(-50%);white-space:nowrap;clip-path:inset(-12px 100% -12px 0)}
.word span{display:inline-block;transform:skewX(-9deg);font:800 clamp(28px,9vw,76px)/1.15 Sora,'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.02em;color:#fff}
.word b{color:var(--g);font-weight:inherit}
.tag{position:absolute;left:0;right:0;top:calc(52% + 22px);text-align:center;padding:0 clamp(16px,6vw,32px);font-size:clamp(13px,3.8vw,18px);font-weight:500;color:rgba(255,255,255,.75);opacity:0;transform:translateY(6px);transition:opacity .7s ease,transform .7s ease}
.tag.on{opacity:1;transform:none}
.rider{position:absolute;left:0;bottom:calc(48% - 1px);width:clamp(72px,20vw,120px);will-change:transform;transform:translateX(-200px)}
.rider svg{display:block;width:100%;height:auto;overflow:visible}
.sp{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:374px){
 .road{left:12px;right:12px}
 .word span{font-size:clamp(24px,8.5vw,52px)}
 .rider{width:clamp(64px,18vw,96px)}
}
@media(min-width:375px)and(max-width:767px){
 .word span{font-size:clamp(28px,9vw,64px)}
 .rider{width:clamp(72px,18vw,110px)}
}
@media(prefers-reduced-motion:reduce){.sp{animation:none}.tag{transition:none}}
</style>
</head>
<body>
<main class="stage" id="stage" role="img" aria-label="TGV Livraison. Livré à temps, reçu avec le sourire.">
 <div class="road"></div>
 <div class="word" id="word"><span>TGV <b>Livraison</b></span></div>
 <div class="tag" id="tag">Livré à temps, reçu avec le sourire</div>
 <div class="rider" id="rider">
  <svg viewBox="0 0 96 64" fill="none" aria-hidden="true">
   <path d="M-46 32h40M-32 42h26M-40 22h32" stroke="#46C630" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
   <rect x="6" y="22" width="22" height="18" rx="3" fill="#46C630"/>
   <path d="M22 44L58 44L62 38L48 34L30 36Z" fill="#fff"/>
   <path d="M40 34L52 38L54 46" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M36 34L44 14L52 16L48 34Z" fill="#fff"/>
   <path d="M50 18L64 26" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
   <circle cx="48" cy="8" r="6.5" fill="#fff"/>
   <path d="M78 48L68 28L62 30M64 27L72 26" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
   <g class="sp"><circle cx="20" cy="48" r="10" stroke="#fff" stroke-width="3"/><circle cx="20" cy="41" r="1.8" fill="#46C630"/></g>
   <g class="sp"><circle cx="78" cy="48" r="10" stroke="#fff" stroke-width="3"/><circle cx="78" cy="41" r="1.8" fill="#46C630"/></g>
  </svg>
 </div>
</main>

<script>
// Renseignez l'adresse de l'écran suivant (ex. '../index.html') pour y aller automatiquement à la fin du splash.
const NEXT = null, HOLD_MS = 900;

const stage = document.getElementById('stage'), rider = document.getElementById('rider'),
      word = document.getElementById('word'), tag = document.getElementById('tag');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let running = false;

function finish() {
  word.style.clipPath = 'none';
  rider.style.transform = 'translateX(' + (stage.clientWidth + 200) + 'px)';
  tag.classList.add('on');
  running = false;
  if (NEXT) setTimeout(() => { location.href = NEXT; }, HOLD_MS);
}

function play() {
  if (running) return;
  if (reduce) return finish();
  running = true;
  tag.classList.remove('on');
  word.style.clipPath = 'inset(-12px 100% -12px 0)';
  const W = stage.clientWidth, rw = rider.offsetWidth;
  const from = -rw - 40, to = W + 40, dur = 2200 + W * 0.9;
  const t0 = performance.now();
  const box = word.getBoundingClientRect(), sx = stage.getBoundingClientRect().left;
  (function frame(now) {
    const p = Math.min((now - t0) / dur, 1), x = from + (to - from) * p;
    rider.style.transform = 'translateX(' + x + 'px)';
    const edge = x + rw * 0.06 + sx - box.left;
    const cut = Math.max(-20, Math.min(box.width, box.width - edge));
    word.style.clipPath = 'inset(-12px ' + cut + 'px -12px 0)';
    if (p < 1) requestAnimationFrame(frame); else finish();
  })(t0);
}

stage.addEventListener('click', () => { if (!NEXT) play(); });
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(play, 250));

(function fixVH(){
  let vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', vh+'px');
  let ticking = false;
  window.addEventListener('resize',()=>{
   if(!ticking){ticking=true;requestAnimationFrame(()=>{vh=window.innerHeight*0.01;document.documentElement.style.setProperty('--vh',vh+'px');ticking=false})}
  });
})();
</script>
</body>
</html>
