<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TGV Livraison (v3) · Commandez une course express</title>
  <meta name="description" content="Livraison express à Cotonou, Calavi, Sémè-Podji, Porto-Novo et Ouidah. Choisissez votre course, indiquez le trajet et confirmez instantanément.">
  <meta name="application-name" content="TGV Livraison">
  <meta name="version" content="3.0.0">
  <meta name="theme-color" content="#F6F4EF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TGVLivraison">

  <!-- Favicons and PWA Icons -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">

  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Immediate Theme Initializer -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('tgv_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0E1512');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body class="bg-[#F6F4EF] text-[#0E1512] dark:bg-[#0E1512] dark:text-[#F6F4EF] font-sans antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
